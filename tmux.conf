# set zsh as default shell
set-option -g default-shell /bin/zsh

# change prefix keybind to a
unbind C-b
set -g prefix C-a
bind C-a send-prefix # Now prefix => C-a sends the prefix to the nested process

# start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
run '~/.tmux/plugins/tpm/tpm'

# Leave this alone -- #[default] in the format below resets to whatever this
# is, so anything but 'default' makes the whole entry red
set -g window-status-current-style default

# Active window: red name, and drop the '*' flag and the space after the icon
set -g window-status-current-format '#I:#[fg=black,bg=red]#{s/^(.) /\1/:window_name}#[default]#{s/\*//:window_flags}'

# Inactive windows: same, but the flag to drop is the last-window '-'
set -g window-status-format '#I:#{s/^(.) /\1/:window_name}#{s/-//:window_flags}'

# new keybinds
bind Enter split-window -h -c "#{pane_current_path}" # Make a new pane to the right

# Drop the pane_title quote tmux shows by default in status-right
set -g status-right '%H:%M %d-%b-%y'
