# set zsh as default shell
set-option -g default-shell /bin/zsh

# change prefix keybind to a
unbind C-b
set -g prefix C-a
bind C-a send-prefix # Now prefix => C-a sends the prefix to the nested process

# start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
# automatically renumber them when windows are closed
set -g renumber-windows on

# Plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
run '~/.tmux/plugins/tpm/tpm'

# Leave this alone -- #[default] in the format below resets to whatever this
# is, so anything but 'default' makes the whole entry red
set -g window-status-current-style default

# Active window: red including the index and colon, and drop the '*' flag
# and the space after the icon
set -g window-status-current-format '#[fg=black,bg=red]#I:#{s/^(.) /\1/:window_name}#[default]#{s/\*//:window_flags}'

# Inactive windows: same, but the flag to drop is the last-window '-'. Also
# flags yellow (index and colon included) when @claude-waiting is set on the
# window - a plain window option instead of tmux's bell mechanism, since bell
# can't highlight silently without also showing a "Bell in window N" message
# (see visual-bell in tmux(1))
set -g window-status-format '#{?@claude-waiting,#[fg=black]#[bg=yellow],}#I:#{s/^(.) /\1/:window_name}#[default]#{s/-//:window_flags}'

# Clears the flag the moment the window becomes active, rather than waiting
# on Claude Code's next hook event (PreToolUse/UserPromptSubmit) - those fire
# on Claude's own activity, with no idea whether the window's been looked at
set-hook -g session-window-changed 'set-window-option -u @claude-waiting'

# new keybinds
bind Enter split-window -h -c "#{pane_current_path}" # Make a new pane to the right

# Manual detach (prefix d): mark the session as intentionally kept before
# detaching, so the prune hook below leaves it alone. Closing the terminal
# window instead sends the client a SIGHUP, which tmux also handles as a
# detach but which never runs this binding, so no marker gets set and the
# session is fair game for pruning.
bind d set-option @keep-detached 1 \; detach-client

# Prune per-window scratch sessions down to a floor of 1: whenever a client
# detaches, kill that session unless it was marked via the manual-detach
# binding above, or it's the only session left. This keeps stale sessions
# from piling up while always leaving exactly one around to reattach to.
set-hook -g client-detached 'run-shell "if [ \"$(tmux show-option -t \"#{session_name}\" -qv @keep-detached 2>/dev/null)\" = 1 ]; then tmux set-option -t \"#{session_name}\" -u @keep-detached 2>/dev/null; else [ \"$(tmux list-sessions 2>/dev/null | wc -l)\" = 1 ] || tmux kill-session -t \"#{session_name}\" 2>/dev/null; fi"'

# Drop the pane_title quote tmux shows by default in status-right
set -g status-right '%H:%M %d-%b-%y'

# prevent nested tmux sessions from showing the date and time
set-hook -g session-created 'if-shell -b "[ -n \"$TMUX\" ]" "set status-right \"\""'

# Default status-left-length (10) is too short for "[term-XXXXX] " session
# names, so it silently truncates the closing bracket and runs into window 1
set -g status-left-length 20
